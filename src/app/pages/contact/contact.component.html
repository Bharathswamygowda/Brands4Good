<app-header></app-header>
<section id="banner" style="background-image: url('./assets/images/contact/contact-us.jpg');">
  <div class="container">
    <div class="row">
      <div class="col-lg-12"></div>
    </div>
  </div>
</section>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-9">
      <h1 class="mb-5">Book a conversation now</h1>
      <form #contactus="ngForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="your-name" class="form-label">Name</label>
            <input type="text" class="form-control" id="your-name" name="your-name" [(ngModel)]="formFileds.name" required>
          </div>
          <div class="col-md-6">
            <label for="your-surname" class="form-label">Surname</label>
            <input type="text" class="form-control" id="your-surname" name="your-surname" [(ngModel)]="formFileds.surName"  required>
          </div>
          <div class="col-md-6">
            <label for="your-email" class="form-label">Email</label>
            <input [pattern]="emailValid" type="email" class="form-control" id="your-email" name="your-email" [(ngModel)]="formFileds.email"  required>
          </div>
          <div class="col-md-6">
            <label for="your-subject" class="form-label">Subject</label>
            <input type="text" class="form-control" id="your-subject" [(ngModel)]="formFileds.subject" name="your-subject">
          </div>
          <div class="col-12">
            <label for="your-message" class="form-label">Message</label>
            <textarea class="form-control" id="your-message" name="your-message" rows="5" required [(ngModel)]="formFileds.message"></textarea>
          </div>
          <div class="col-12">
            <div class="row">
              <div class="col-md-6">
                <button (click)="sendEmail()"  [disabled]="contactus.invalid" type="submit" class="btn btn-dark w-100 fw-bold" >Send</button>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>


<app-footer></app-footer>
